<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#f2ecdd"/>

  <!-- logo -->
  <g font-family="Arial Black, Archivo Black, sans-serif" font-weight="900" transform="rotate(-2 200 120)">
    <text x="78" y="142" font-size="92" fill="#ff5f00">SAPU</text>
    <text x="78" y="232" font-size="92" fill="#ff5f00">SQUAD</text>
    <text x="70" y="134" font-size="92" fill="#1c1813">SAPU</text>
    <text x="70" y="224" font-size="92" fill="#1c1813">SQUAD</text>
  </g>

  <!-- broom planet -->
  <g transform="translate(600 200) scale(0.42)">
    <circle cx="512" cy="512" r="500" fill="#ff5f00"/>
    <circle cx="512" cy="512" r="432" fill="#1c1813"/>
    <circle cx="512" cy="512" r="416" fill="#bde6f2"/>
    <g fill="#2bb673">
      <circle cx="330" cy="320" r="34"/><circle cx="408" cy="300" r="34"/><circle cx="370" cy="388" r="34"/>
      <circle cx="448" cy="372" r="34"/><circle cx="292" cy="398" r="30"/>
      <circle cx="700" cy="420" r="34"/><circle cx="760" cy="488" r="30"/><circle cx="688" cy="500" r="30"/>
      <circle cx="420" cy="740" r="30"/><circle cx="492" cy="768" r="30"/><circle cx="560" cy="736" r="26"/>
    </g>
    <g fill="#1c1813"><circle cx="238" cy="690" r="14"/><circle cx="286" cy="760" r="11"/><circle cx="218" cy="596" r="9"/></g>
    <g transform="rotate(-34 512 512)">
      <rect x="484" y="128" width="56" height="470" rx="28" fill="#1c1813"/>
      <rect x="448" y="560" width="128" height="74" rx="16" fill="#ff5f00" stroke="#1c1813" stroke-width="12"/>
      <path d="M452 634 L572 634 L612 836 L412 836 Z" fill="#ffd400" stroke="#1c1813" stroke-width="12" stroke-linejoin="round"/>
      <g stroke="#1c1813" stroke-width="10" stroke-linecap="round">
        <line x1="472" y1="668" x2="452" y2="810"/><line x1="512" y1="668" x2="512" y2="814"/><line x1="552" y1="668" x2="572" y2="810"/>
      </g>
    </g>
  </g>

  <!-- three lines -->
  <g font-family="Arial Black, Archivo Black, sans-serif" font-weight="900" fill="#1c1813">
    <text x="78" y="740" font-size="68">TRASH GETS PICKED.</text>
    <text x="78" y="830" font-size="68">PEOPLE GET PAID.</text>
    <text x="78" y="920" font-size="68">YOU WATCH IT HAPPEN.</text>
  </g>

  <!-- hazard tape with url -->
  <defs>
    <pattern id="haz" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="40" height="40" fill="#ffd400"/><rect width="20" height="40" fill="#1c1813"/>
    </pattern>
  </defs>
  <rect x="0" y="990" width="1080" height="16" fill="url(#haz)"/>
  <rect x="0" y="1006" width="1080" height="58" fill="#ffd400"/>
  <rect x="0" y="1064" width="1080" height="16" fill="url(#haz)"/>
  <text x="540" y="1048" text-anchor="middle" font-family="Courier New, Space Mono, monospace" font-weight="700" font-size="36" fill="#1c1813" letter-spacing="4">SAPU.EARTH</text>
</svg>
